[pytest]
# Not a .py file on purpose: the Cat imports every .py it finds in the plugin
# folder, so pytest configuration must not be one of them.
testpaths = .tests
# The tests live in a hidden folder so the Cat's glob("**/*.py") never imports
# them. pytest's default norecursedirs contains ".*", which would make
# `pytest .` collect nothing from it; this list is the default without that
# pattern.
norecursedirs = *.egg build dist CVS _darcs {arch} node_modules venv __pycache__
# "." makes `kuma_client` importable, "/app" makes the core importable inside
# the container. A path that does not exist is ignored, so the same file works
# on a developer machine.
pythonpath = . /app
# The plugin folder is bind-mounted, so .pytest_cache ends up owned by whichever
# side ran first and unwritable by the other. Nothing here uses --lf.
addopts = -q -p no:cacheprovider
